      content:`React 18 是 React 发展史上最重要的版本之一，它引入了**并发渲染（Concurrent Rendering）**这一革命性特性。

## 什么是并发渲染？

并发渲染是 React 18 的核心概念。在传统渲染中，React 的更新是不可中断的——一旦开始渲染，就必须完成整个渲染过程。而并发渲染允许 React 在渲染过程中"暂停"和"恢复"，从而让更高优先级的更新能够先被处理。

## 关键 API

### Suspense

\`Suspense\` 组件允许你在组件树中声明"加载状态"：

\`\`\`jsx
import { Suspense } from 'react';

function App() {
  return (
    <Suspense fallback={<Loading />}>
      <AsyncComponent />
    </Suspense>
  );
}
\`\`\`

### useTransition

\`useTransition\` 允许你将某些状态更新标记为"低优先级"：

\`\`\`jsx
const [isPending, startTransition] = useTransition();
startTransition(() => { setQuery(q); });
\`\`\`

## 性能优化实践

在实际项目中，合理使用并发特性可以显著提升用户体验。以下是一些最佳实践：

1. **使用 Suspense 包裹异步组件**
2. **用 useTransition 处理搜索输入**
3. **用 useDeferredValue 延迟非关键更新**

> 并发模式是 React 未来的基石，掌握它将使你能够构建更流畅的用户界面。

以上就是 React 18 并发特性的核心内容。`, author:{name:'Grit',avatar:''}, reads:1250 },

  /* =================================================================
     Markdown 简单渲染
     ================================================================= */
  function renderMarkdown(md) {
    let html = esc(md);
    // 代码块
    html = html.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre class="bg-slate-800 text-slate-100 p-4 rounded-lg overflow-x-auto my-4 text-sm"><code>$2</code></pre>');
    // 行内代码
    html = html.replace(/`([^`]+)`/g, '<code class="bg-slate-100 text-slate-700 px-1.5 py-0.5 rounded text-sm">$1</code>');
    // 粗体
    html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    // H2
    html = html.replace(/^## (.+)$/gm, '<h2 class="text-xl font-bold mt-8 mb-3 text-heading" style="color:#1e293b;">$1</h2>');
    // H3
    html = html.replace(/^### (.+)$/gm, '<h3 class="text-lg font-semibold mt-6 mb-2 text-heading" style="color:#334155;">$1</h3>');
    // 引用
    html = html.replace(/^&gt; (.+)$/gm, '<blockquote class="border-l-4 border-slate-400 pl-4 my-3 italic" style="color:#555;">$1</blockquote>');
    // 列表
    html = html.replace(/^- (.+)$/gm, '<li class="ml-4 list-disc my-1">$1</li>');
    html = html.replace(/^(\d+)\. (.+)$/gm, '<li class="ml-4 list-decimal my-1">$2</li>');
    // 段落
    html = html.replace(/\n\n/g, '</p><p class="my-3">');
    html = '<p class="my-3">' + html + '</p>';
    return html;
  }

  function esc(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    setTheme(saved === 'dark' || (!saved && prefersDark));

    btn.addEventListener('click', () => setTheme(!html.classList.contains('dark')));
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {

  function initSearch() {
    const wrap  = document.getElementById('search-wrap');

    function open() {

     ================================================================ */
  class StreamingSimulator {
    constructor(onChunk, onDone) { this.onChunk = onChunk; this.onDone = onDone; this.timer = null; this.aborted = false; }
    stream(text, speed = 28) {
      this.abort(); this.aborted = false; let i = 0; const chars = [...text];
      const tick = () => {
        if (this.aborted || i >= chars.length) { if (!this.aborted && this.onDone) this.onDone(); return; }
        const size = Math.floor(Math.random() * 3) + 1;
        this.onChunk(chars.slice(i, i + size).join('')); i += size;
        const jitter = (Math.random() - 0.5) * 14;
        this.timer = setTimeout(tick, speed + jitter);
      };
      this.timer = setTimeout(tick, speed + 60);
    }
    abort() { this.aborted = true; clearTimeout(this.timer); }
  }

  class ApiConnector {
    constructor(apiUrl) { this.apiUrl = apiUrl; }
    async sendMessage(query, onChunk, onDone, onError) {
      if (!this.apiUrl) { onError(new Error('API URL 未配置')); return; }
      try {
        const res = await fetch(this.apiUrl, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({query}) });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const reader = res.body?.getReader();
        if (reader) {
          const decoder = new TextDecoder(); let buf = '';
          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buf += decoder.decode(value, { stream:true });
            const lines = buf.split('\n'); buf = lines.pop() || '';
            for (const line of lines) {
              if (line.startsWith('data: ')) {
                const raw = line.slice(6);
                if (raw === '[DONE]') { onDone(); return; }
                try { onChunk(JSON.parse(raw).content || JSON.parse(raw).text || ''); } catch { onChunk(raw); }
              }
            }
          }
          onDone();
        } else {
          const data = await res.json();
          onChunk(data.content || data.text || data.message || JSON.stringify(data));
          onDone();
        }
      } catch (e) { onError(e); }
    }
  }

  const DEMO_SHORT = `收到你的消息了。

  class ChatComponent {
    constructor(opts = {}) {
      this.apiUrl = opts.apiUrl || ''; this.title = opts.title || 'AI 助手';
      this.placeholder = opts.placeholder || '输入消息，Enter 发送…';
      this.messages = []; this.isOpen = false; this.isStreaming = false;
      this.streamer = new StreamingSimulator((chunk) => this._onChunk(chunk), () => this._onDone());
      this.api = new ApiConnector(this.apiUrl); this._streamTarget = null; this._simStarted = false;
      this._init();
    }
    _init() { this._render(); this._cacheDOM(); this._bindEvents(); this._addWelcome(); }
    _render() {
      document.getElementById('chat-root').innerHTML = `
<button id="ctb" class="fixed bottom-8 right-8 w-14 h-14 rounded-full bg-slate-700 text-white flex items-center justify-center z-50 float-btn-3d hover:bg-slate-800 active:scale-95" aria-label="打开聊天">

  <svg id="icon-close" class="w-6 h-6 hidden" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
</button>
<div id="cw" class="fixed bottom-24 right-8 w-[460px] h-[660px] z-40 hidden">
  <div class="perspective-wrapper w-full h-full">
    <div class="card-3d chat-enter w-full h-full bg-white rounded-2xl flex flex-col overflow-hidden border border-slate-200/50">
      <div class="flex items-center justify-between px-5 py-4 border-b border-slate-100 flex-shrink-0">
        <div class="flex items-center gap-3">
          <div class="w-9 h-9 rounded-full bg-slate-600 flex items-center justify-center shadow-sm">
            <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 2a7 7 0 017 7c0 2.9-1.8 5.4-4.3 6.5L12 22l-2.7-6.5A7 7 0 015 9a7 7 0 017-7z"/></svg>
          </div>
          <div><h3 class="font-medium text-slate-800 text-sm">${this.title}</h3><p class="text-xs text-slate-400 flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full bg-slate-400 inline-block"></span>在线</p></div>
        </div>
        <button id="ccl" class="w-8 h-8 rounded-lg hover:bg-slate-100 flex items-center justify-center text-slate-400 hover:text-slate-600 transition-colors" aria-label="关闭"><svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
      </div>
      <div id="cmsg" class="msg-area flex-1 overflow-y-auto px-4 py-4 space-y-5 bg-slate-50/60">
        <div id="ctyping" class="flex items-end gap-2 hidden">
          <div class="w-8 h-8 rounded-full bg-slate-600 flex items-center justify-center flex-shrink-0"><svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 2a7 7 0 017 7c0 2.9-1.8 5.4-4.3 6.5L12 22l-2.7-6.5A7 7 0 015 9a7 7 0 017-7z"/></svg></div>
          <div class="flex gap-1 px-4 py-3 bg-white rounded-2xl rounded-bl-md border border-slate-100 shadow-sm"><span class="typing-dot w-2 h-2 rounded-full bg-slate-300"></span><span class="typing-dot w-2 h-2 rounded-full bg-slate-300"></span><span class="typing-dot w-2 h-2 rounded-full bg-slate-300"></span></div>

          <button id="csend" class="w-10 h-10 rounded-lg bg-slate-600 text-white flex items-center justify-center flex-shrink-0 hover:bg-slate-700 active:scale-95 transition-all duration-200 shadow-md shadow-slate-200" aria-label="发送"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg></button>

    }
    _cacheDOM() {
      this.$toggle=document.getElementById('ctb'); this.$window=document.getElementById('cw');
      this.$msgs=document.getElementById('cmsg'); this.$input=document.getElementById('cinp');
      this.$send=document.getElementById('csend'); this.$typing=document.getElementById('ctyping');
      this.$iconOpen=document.getElementById('icon-open'); this.$iconClose=document.getElementById('icon-close');
      this.$closeBtn=document.getElementById('ccl');
    }
    _bindEvents() {
      this.$toggle.addEventListener('click',()=>this.toggle());
      this.$closeBtn.addEventListener('click',()=>this.close());
      this.$send.addEventListener('click',()=>this._send());
      this.$input.addEventListener('keydown',(e)=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();this._send();}});
      const card=this.$window.querySelector('.card-3d');
      this.$window.addEventListener('mousemove',(e)=>{if(!card)return;const r=this.$window.getBoundingClientRect();const x=(e.clientX-r.left)/r.width-0.5;const y=(e.clientY-r.top)/r.height-0.5;card.style.transform=`rotateX(${2.5-y*6}deg) rotateY(${-3+x*8}deg)`;});
      this.$window.addEventListener('mouseleave',()=>{if(card)card.style.transform='rotateX(2.5deg) rotateY(-3deg)';});
    }
    _addWelcome() {
      this.messages.push({role:'assistant',content:'你好！我是 GRIT 博客的 AI 助手。\n\n你可以问我任何问题，我会以流式输出的方式为你解答。当前处于演示模式，试试看吧！'});
      this._renderMsg(this.messages[0]);
    }
    toggle(){this.isOpen?this.close():this.open();}
    open(){this.isOpen=true;this.$window.classList.remove('hidden');this.$iconOpen.classList.add('hidden');this.$iconClose.classList.remove('hidden');const card=this.$window.querySelector('.card-3d');if(card){card.classList.remove('chat-enter');void card.offsetWidth;card.classList.add('chat-enter');}setTimeout(()=>this.$input.focus(),400);}
    close(){this.isOpen=false;this.$window.classList.add('hidden');this.$iconOpen.classList.remove('hidden');this.$iconClose.classList.add('hidden');}
    async _send() {
      if(this.isStreaming)return;const text=this.$input.value.trim();if(!text)return;this.$input.value='';
      const userMsg={role:'user',content:text};this.messages.push(userMsg);this._renderMsg(userMsg);
      const botMsg={role:'assistant',content:''};this.messages.push(botMsg);const botEl=this._renderMsg(botMsg,true);
      this._showTyping(true);this.isStreaming=true;this.$send.disabled=true;this.$send.classList.add('opacity-50','cursor-not-allowed');
      let apiOK=false;
      this.api.sendMessage(text,
        (chunk)=>{if(!apiOK){this._showTyping(false);apiOK=true;}botMsg.content+=chunk;const ce=botEl.querySelector('.mc');if(ce)ce.textContent=botMsg.content;this._scroll();},
        ()=>{this.isStreaming=false;this._showTyping(false);this._enableSend();botEl&&botEl.classList.remove('typing-cursor');},
        (err)=>{console.warn('API 不可用，使用演示模式:',err.message);if(!apiOK)this._simStream(botMsg,botEl);}
      );
    }
    _simStream(botMsg,botEl){if(this._simStarted)return;this._simStarted=true;const prev=this.messages[this.messages.length-2];const txt=(prev?.content||'').length<20?DEMO:DEMO_SHORT;setTimeout(()=>{this._showTyping(false);this.streamer.stream(txt,26);this._streamTarget={msg:botMsg,el:botEl};},650);}
    _onChunk(chunk){const t=this._streamTarget;if(!t)return;t.msg.content+=chunk;const ce=t.el.querySelector('.mc');if(ce)ce.textContent=t.msg.content;this._scroll();}
    _onDone(){this._simStarted=false;this._streamTarget=null;this.isStreaming=false;this._enableSend();const last=this.$msgs.querySelector('.mr.bot:last-child');if(last)last.classList.remove('typing-cursor');}
    _enableSend(){this.$send.disabled=false;this.$send.classList.remove('opacity-50','cursor-not-allowed');this.$input.focus();}
    _renderMsg(msg,streamingPlaceholder){
      const bot=msg.role==='assistant';
      const rowCls=bot?'mr bot flex items-start gap-2 msg-enter':'mr user flex items-start gap-2 justify-end msg-enter';
      const avatar=bot?`<div class="w-7 h-7 rounded-full bg-slate-600 flex items-center justify-center flex-shrink-0 mt-0.5 shadow-sm"><svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 2a7 7 0 017 7c0 2.9-1.8 5.4-4.3 6.5L12 22l-2.7-6.5A7 7 0 015 9a7 7 0 017-7z"/></svg></div>`:'';
      const bubbleCls=bot?'bubble-3d bg-white border border-slate-100 rounded-2xl rounded-bl-md px-4 py-2.5 shadow-sm max-w-[85%]':'bubble-3d bg-slate-600 text-white rounded-2xl rounded-br-md px-4 py-2.5 max-w-[80%] shadow-md shadow-slate-300/40';
      const curCls=(bot&&streamingPlaceholder)?' typing-cursor':'';
      const row=document.createElement('div');row.className=`${rowCls}${curCls}`;
      row.innerHTML=`${avatar}<div class="${bubbleCls}"><div class="mc text-sm leading-relaxed whitespace-pre-wrap break-words">${esc( msg.content)}</div></div>`;
      this.$msgs.insertBefore(row,this.$typing);this._scroll();return row;
    }
    _showTyping(v){this.$typing.classList.toggle('hidden',!v);if(v)this._scroll();}
    _scroll(){requestAnimationFrame(()=>{this.$msgs.scrollTop=this.$msgs.scrollHeight;});}
    setApiUrl(url){this.apiUrl=url;this.api=new ApiConnector(url);}
  }
