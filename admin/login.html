<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GRIT 管理后台 — 登录</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    ::-webkit-scrollbar { width: 4px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    html.dark body { background: #282c34; }
    html.dark .login-card { background: #2c313a !important; border-color: #3e4451 !important; }
    html.dark .login-input { background: #1e2227 !important; border-color: #3e4451 !important; color: #abb2bf !important; }
    html.dark .login-label { color: #abb2bf !important; }
    html.dark .nav-text { color: #e5e7eb !important; }
    .login-input:focus { border-color: #475569; box-shadow: 0 0 0 3px rgba(71,85,105,0.15); outline: none; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6" style="background:#f8fafc;">

<div class="w-full max-w-md">
  <!-- Logo 区域 -->
  <div class="text-center mb-8">
    <a href="../frontend/index.html" class="inline-flex items-center gap-2.5 select-none mb-6" style="text-decoration:none;">
      <svg class="w-12 h-12" viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="32" y="4" width="2" height="32" rx="1" fill="#64748b"/><rect x="42" y="4" width="2" height="32" rx="1" fill="#64748b"/><rect x="30" y="3" width="16" height="3" rx="1.5" fill="#64748b"/>
        <rect x="34" y="20" width="8" height="18" rx="4" fill="#475569"/>
        <circle cx="38" cy="12" r="8" fill="#fbbf24" stroke="#d97706" stroke-width="1"/>
        <path d="M32 6 Q36 2 42 4 Q46 7 45 10 L44 5 Q40 1 34 4 Z" fill="#92400e"/>
        <rect x="33" y="10" width="4.5" height="3" rx="1" fill="none" stroke="#1e293b" stroke-width="1.2"/><rect x="38.5" y="10" width="4.5" height="3" rx="1" fill="none" stroke="#1e293b" stroke-width="1.2"/><line x1="37.5" y1="11.5" x2="38.5" y2="11.5" stroke="#1e293b" stroke-width="1"/>
        <circle cx="35.25" cy="11.5" r="0.8" fill="#0f172a"/><circle cx="40.75" cy="11.5" r="0.8" fill="#0f172a"/>
        <line x1="36.5" y1="15.5" x2="39.5" y2="15.5" stroke="#d97706" stroke-width="0.8" stroke-linecap="round"/>
        <path d="M34 26 Q28 28 26 34" stroke="#475569" stroke-width="3.5" stroke-linecap="round"/><path d="M42 26 Q48 28 50 34" stroke="#475569" stroke-width="3.5" stroke-linecap="round"/>
        <circle cx="26" cy="34" r="2" fill="#fbbf24" stroke="#d97706" stroke-width="0.5"/><circle cx="50" cy="34" r="2" fill="#fbbf24" stroke="#d97706" stroke-width="0.5"/>
        <rect x="2" y="36" width="52" height="3" rx="1" fill="#64748b"/><rect x="6" y="39" width="3" height="14" rx="1" fill="#475569"/><rect x="47" y="39" width="3" height="14" rx="1" fill="#475569"/>
        <rect x="22" y="36" width="12" height="2" rx="1" fill="#334155"/><rect x="26" y="30" width="4" height="6" fill="#334155"/>
        <rect x="8" y="8" width="24" height="18" rx="2" fill="#334155"/><rect x="10.5" y="10" width="19" height="14" rx="1" fill="#1e293b"/>
        <rect x="12" y="11.5" width="8" height="1.2" rx="0.6" fill="#38bdf8"/><rect x="12" y="13.5" width="12" height="1.2" rx="0.6" fill="#a78bfa"/><rect x="12" y="15.5" width="6" height="1.2" rx="0.6" fill="#f472b6"/><rect x="12" y="17.5" width="14" height="1.2" rx="0.6" fill="#38bdf8"/><rect x="12" y="19.5" width="10" height="1.2" rx="0.6" fill="#a78bfa"/><rect x="12" y="21.5" width="9" height="1.2" rx="0.6" fill="#4ade80"/>
        <rect x="30" y="36" width="20" height="2.5" rx="1" fill="#475569"/><line x1="32" y1="37.2" x2="48" y2="37.2" stroke="#64748b" stroke-width="0.5"/>
      </svg>
      <span class="text-2xl font-black tracking-wider text-slate-800 nav-text" style="font-family:'Impact','Arial Black',sans-serif;">GRIT <span class="text-base font-semibold text-slate-500 nav-text">管理后台</span></span>
    </a>
  </div>

  <!-- 登录卡片 -->
  <div class="login-card rounded-xl p-8 shadow-sm" style="background:#fff;border:1px solid #e0e0e0;">
    <h1 class="text-lg font-bold mb-6" style="color:#1e293b;">账号登录</h1>

    <form id="login-form" class="space-y-5" autocomplete="off">
      <div>
        <label class="login-label block text-sm font-medium mb-1.5" style="color:#475569;">账号</label>
        <input id="username" type="text" class="login-input w-full px-4 py-2.5 rounded-lg border text-sm" style="background:#f9fafb;border-color:#d1d5db;color:#334155;" placeholder="请输入账号" autocomplete="off" />
      </div>
      <div>
        <label class="login-label block text-sm font-medium mb-1.5" style="color:#475569;">密码</label>
        <input id="password" type="password" class="login-input w-full px-4 py-2.5 rounded-lg border text-sm" style="background:#f9fafb;border-color:#d1d5db;color:#334155;" placeholder="请输入密码" autocomplete="off" />
      </div>

      <div id="login-error" class="text-sm text-red-500 hidden"></div>

      <button type="submit" class="w-full py-2.5 rounded-lg text-sm text-white font-medium hover:opacity-90 transition-opacity" style="background:#475569;">
        登 录
      </button>
    </form>

    <p class="text-xs text-center mt-5" style="color:#94a3b8;">暂无注册功能，请联系管理员获取账号</p>
  </div>

  <!-- 页脚 -->
  <p class="text-center text-xs mt-8" style="color:#94a3b8;">&copy; 2026 GRIT Blog. All rights reserved.</p>
</div>

<script>
(function(){
  // 默认账号
  const VALID_USER = 'admin';
  const VALID_PASS = 'admin123';

  // 检查是否已登录
  if (localStorage.getItem('admin_auth')) {
    window.location.replace('/admin/index.html');
    return;
  }

  // 主题
  (function(){
    const saved = localStorage.getItem('admin_theme');
    const prefers = window.matchMedia('(prefers-color-scheme:dark)').matches;
    if (saved === 'dark' || (!saved && prefers)) {
      document.documentElement.classList.add('dark');
    }
  })();

  // 表单提交
  document.getElementById('login-form').addEventListener('submit', function(e) {
    e.preventDefault();
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value.trim();
    const errorEl = document.getElementById('login-error');

    if (!username || !password) {
      errorEl.textContent = '请输入账号和密码';
      errorEl.classList.remove('hidden');
      return;
    }

    if (username !== VALID_USER || password !== VALID_PASS) {
      errorEl.textContent = '账号或密码错误';
      errorEl.classList.remove('hidden');
      return;
    }

    // 登录成功
    localStorage.setItem('admin_auth', JSON.stringify({
      username: username,
      loginTime: Date.now()
    }));
    window.location.replace('/admin/index.html');
  });

  // 回车提交
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && document.activeElement.tagName !== 'BUTTON') {
      document.getElementById('login-form').dispatchEvent(new Event('submit'));
    }
  });
})();
</script>
</body>
</html>
