/* =================================================================
   API Layer —— 封装所有数据操作（后期替换为 fetch 调用）
   ================================================================= */
const API = {
  // ---- 文章 ----
  getArticles()      { return [...Store.articles]; },
  getArticle(id)     { return Store.articles.find(a=>a.id===id)||null; },
  createArticle(data){ const a={...data,id:Store.nextId++,date:new Date().toLocaleString('zh-CN'),likes:0,favs:0,reads:0}; Store.articles.unshift(a); this._syncCats(); return a; },
  updateArticle(id,data){ const a=Store.articles.find(a=>a.id===id); if(a){ Object.assign(a,data); this._syncCats(); } return a; },
  deleteArticle(id)  { Store.articles=Store.articles.filter(a=>a.id!==id); Store.comments=Store.comments.filter(c=>c.articleId!==id); this._syncCats(); },
  _syncCats(){ const map={}; Store.articles.forEach(a=>{ if(a.category) map[a.category]=(map[a.category]||0)+1; }); Store.categories.forEach(c=>{ c.count=map[c.name]||0; }); },

  // ---- 分类 ----
  getCategories(){ return [...Store.categories]; },
  createCategory(data){ const c={...data,id:Date.now()}; Store.categories.push(c); return c; },
  updateCategory(id,data){ const c=Store.categories.find(c=>c.id===id); if(c)Object.assign(c,data); return c; },
  deleteCategory(id){ Store.categories=Store.categories.filter(c=>c.id!==id); },

  // ---- 标签 ----
  getTags(){ return [...Store.tags]; },
  createTag(name){ if(!Store.tags.includes(name)){ Store.tags.push(name); } return Store.tags; },
  updateTag(oldName,newName){ const i=Store.tags.indexOf(oldName); if(i>=0)Store.tags[i]=newName; Store.articles.forEach(a=>{ const j=a.tags.indexOf(oldName); if(j>=0)a.tags[j]=newName; }); return Store.tags; },
  deleteTag(name){ Store.tags=Store.tags.filter(t=>t!==name); Store.articles.forEach(a=>{ a.tags=a.tags.filter(t=>t!==name); }); },

  // ---- 评论 ----
  getComments(){ return [...Store.comments]; },
  createComment(data){ const c={...data,id:Date.now(),time:new Date().toLocaleString('zh-CN')}; Store.comments.unshift(c); return c; },
  updateComment(id,data){ const c=Store.comments.find(c=>c.id===id); if(c)Object.assign(c,data); return c; },
  deleteComment(id){ Store.comments=Store.comments.filter(c=>c.id!==id); },

  // ---- 用户 ----
  getUser(){ return {...Store.user}; },
  updateUser(data){ Object.assign(Store.user,data); return Store.user; },
};

/* =================================================================
   Router & Navigation
   ================================================================= */
let currentPage = 'all-articles';

function navigate(e, page) {
  e.preventDefault();
  currentPage = page;
  updateMenuActive();
  renderPage();
}

function updateMenuActive() {
  document.querySelectorAll('.menu-item').forEach(el=>{
    el.classList.toggle('active', el.dataset.page === currentPage);
  });
}

function renderPage() {
  const main = document.getElementById('main-area');
  switch (currentPage) {
    case 'all-articles':   main.innerHTML = renderAllArticles(); break;
    case 'new-article':    main.innerHTML = renderNewArticle(); initMdEditor(); break;
    case 'all-categories': main.innerHTML = renderAllCategories(); break;
    case 'all-tags':       main.innerHTML = renderAllTags(); break;
    case 'all-comments':   main.innerHTML = renderAllComments(); break;
    default:               main.innerHTML = renderAllArticles();
  }
  // 挂载事件
  setTimeout(bindPageEvents, 0);
}

/* =================================================================
   Sidebar —— 子菜单展开/收起 + 移动端折叠
   ================================================================= */
function toggleSubmenu(btn) {
  const menuName = btn.dataset.menu;
  const sub = document.querySelector(`[data-submenu="${menuName}"]`);
  const arrow = btn.querySelector('svg');
  if (sub && arrow) {
    sub.classList.toggle('open');
    arrow.style.transform = sub.classList.contains('open') ? 'rotate(180deg)' : '';

/* =================================================================
   Modal Helpers
   ================================================================= */
function showModal(html) {
  document.getElementById('modal-container').innerHTML = `
    <div class="modal-overlay show fixed inset-0 z-50 flex items-center justify-center p-4" onclick="if(event.target===this)closeModal()">

        ${html}
      </div>
    </div>
  `;
}
function closeModal() { document.getElementById('modal-container').innerHTML = ''; }

function showToast(msg) {
  const t=document.createElement('div');
  t.className='fixed bottom-6 left-1/2 -translate-x-1/2 z-50 px-5 py-3 rounded-lg text-white text-sm shadow-lg transition-all duration-300';
  t.style.background='#475569'; t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; setTimeout(()=>t.remove(),300); }, 2000);
}

function confirmDialog(msg) { return window.confirm(msg); }

/* =================================================================
   Helper
   ================================================================= */
function esc(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
function mdRender(md){
  let h=esc(md||'');
  h=h.replace(/```(\w*)\n([\s\S]*?)```/g,'<pre><code>$2</code></pre>');
  h=h.replace(/`([^`]+)`/g,'<code>$1</code>');
  h=h.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  h=h.replace(/^### (.+)$/gm,'<h3>$1</h3>');
  h=h.replace(/^## (.+)$/gm,'<h2>$1</h2>');
  h=h.replace(/^# (.+)$/gm,'<h1>$1</h1>');
  h=h.replace(/^> (.+)$/gm,'<blockquote>$1</blockquote>');
  h=h.replace(/^- (.+)$/gm,'<li>$1</li>');
  h=h.replace(/\n\n/g,'</p><p>');
  h='<p>'+h+'</p>';
  return h;
}

function initMdEditor() {
  const input = document.getElementById('md-input');
  const preview = document.getElementById('md-preview');
  if (!input || !preview) return;
  const update = () => { preview.innerHTML = mdRender(input.value); };
  input.addEventListener('input', update);
  update();
}

function handleFileUpload(e) {
  const file = e.target.files[0];
  if (!file) return;
  document.getElementById('file-name').textContent = file.name;
  const reader = new FileReader();
  reader.onload = () => {
    const ta = document.getElementById('md-input');
    if (ta) ta.value = reader.result;
    const preview = document.getElementById('md-preview');
    if (preview) preview.innerHTML = mdRender(reader.result);
  };
  if (file.name.endsWith('.pdf') || file.name.endsWith('.docx') || file.name.endsWith('.doc')) {
    showToast('PDF/Word 文件需要后端解析服务支持，当前仅读取为文本');
    reader.readAsText(file);
  } else {
    reader.readAsText(file);
  }
}

  showToast('文章发布成功！');
  navigate({preventDefault:()=>{}}, 'all-articles');
}

function deleteTagRow(name) {
  if (!confirmDialog('确定删除此标签？')) return;
  API.deleteTag(name);
  renderPage();
  showToast('标签已删除');
}

// ---- 所有评论 ----
function renderAllComments() {
  const comments = API.getComments();
  const rows = comments.map(c=>`
    <tr>
      <td class="text-xs"><a href="#" class="text-indigo-500 hover:underline" onclick="event.preventDefault();viewArticle(${c.articleId})">${esc(c.articleTitle)}</a></td>
      <td>${esc(c.author)}</td>
      <td class="max-w-xs"><span class="line-clamp-2">${esc(c.text)}</span></td>
      <td class="text-xs">${c.time}</td>
      <td>
        <button onclick="editComment(${c.id},'${esc(c.text)}')" class="text-amber-500 hover:underline text-xs mr-2">编辑</button>
        <button onclick="deleteCommentRow(${c.id})" class="text-red-400 hover:underline text-xs">删除</button>
      </td>
    </tr>
  `).join('');

  return `
    <h2 class="text-xl font-bold text-heading mb-5" style="color:#1e293b;">所有评论</h2>
    <div class="card-admin bg-white rounded-lg shadow-sm overflow-hidden" style="border:1px solid #e0e0e0;">
      <table class="data-table w-full">
        <thead><tr><th>所属文章</th><th>评论者</th><th>内容</th><th>时间</th><th>操作</th></tr></thead>
        <tbody>${rows||'<tr><td colspan="5" class="text-center text-slate-400 py-8">暂无评论</td></tr>'}</tbody>
      </table>
    </div>
  `;
}

function editComment(id, text) {
  showModal(`
    <h2 class="text-lg font-bold text-heading mb-4" style="color:#1e293b;">编辑评论</h2>
    <textarea id="edit-comment-text" rows="3" class="input-admin w-full px-3 py-2 rounded-lg border border-slate-200 text-sm outline-none resize-none" style="background:#f9fafb;">${esc(text)}</textarea>
    <div class="flex justify-end gap-3 mt-4">
      <button onclick="closeModal()" class="px-4 py-2 rounded-lg text-sm border border-slate-200 text-slate-600 hover:bg-slate-50">取消</button>
      <button onclick="saveEditComment(${id})" class="px-4 py-2 rounded-lg text-sm text-white hover:opacity-90" style="background:#475569;">保存</button>
    </div>
  `);
}

function saveEditComment(id) {
  API.updateComment(id, { text: document.getElementById('edit-comment-text')?.value.trim() });
  closeModal();
  renderPage();
  showToast('评论已更新');
}

function deleteCommentRow(id) {
  if (!confirmDialog('确定删除此评论？')) return;
  API.deleteComment(id);
  renderPage();
  showToast('评论已删除');
}

/* =================================================================
   Page Event Binding
   ================================================================= */
function bindPageEvents() {
  if (currentPage === 'all-articles') {
    const s = document.getElementById('article-search');
    const c = document.getElementById('article-cat-filter');
    if (s) s.addEventListener('input', filterArticles);
    if (c) c.addEventListener('change', filterArticles);
  }
}

/* =================================================================
   Init
   ================================================================= */
function init() {
  try {
    document.getElementById('user-btn').addEventListener('click', showProfileModal);
    const firstGroup = document.querySelector('[data-menu="articles"]');
    if (firstGroup) toggleSubmenu(firstGroup);
    updateMenuActive();
    renderPage();
    console.log('GRIT 管理后台已就绪');
  } catch (err) {
    console.error('GRIT 管理后台初始化失败:', err);
  }
}

// 暴露到全局 —— 必须在 init() 之前，防止 init 执行出错导致所有按钮失效
window.navigate = navigate;
window.toggleSubmenu = toggleSubmenu;
window.viewArticle = viewArticle;
window.editArticle = editArticle;
window.saveEditArticle = saveEditArticle;
window.deleteArticleRow = deleteArticleRow;
window.filterArticles = filterArticles;
window.resetArticleFilter = resetArticleFilter;
window.handleFileUpload = handleFileUpload;
window.publishArticle = publishArticle;
window.addCategory = addCategory;
window.saveNewCategory = saveNewCategory;
window.editCategory = editCategory;
window.saveEditCategory = saveEditCategory;
window.deleteCategoryRow = deleteCategoryRow;
window.addTag = addTag;
window.saveNewTag = saveNewTag;
window.editTag = editTag;
window.saveEditTag = saveEditTag;
window.deleteTagRow = deleteTagRow;
window.editComment = editComment;
window.saveEditComment = saveEditComment;
window.deleteCommentRow = deleteCommentRow;
window.showProfileModal = showProfileModal;
window.saveProfile = saveProfile;
window.closeModal = closeModal;
window.showToast = showToast;
window.confirmDialog = confirmDialog;

// DOM 渲染完成后初始化
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
})();
</script>
</body>
</html>
